name: Build & Release SpaceClean Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish draft/full release to GitHub'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-export:
    name: Build & Export (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04
            platform: linux

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fakeroot dpkg libfuse2 desktop-file-utils

      - name: Install Dependencies
        run: npm install

      - name: Build Web & Electron Assets
        run: npm run build

      # ================= Windows Export =================
      - name: Package Windows (MSIX, NSIS Setup, Portable)
        if: matrix.platform == 'windows'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: SpaceClean-${{ github.ref_name || 'v3.6.0' }}-Windows
          path: |
            release/*.appx
            release/*.exe
            release/*.blockmap
          if-no-files-found: warn

      # ================= macOS Export =================
      - name: Package macOS (DMG & ZIP)
        if: matrix.platform == 'macos'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: SpaceClean-${{ github.ref_name || 'v3.6.0' }}-macOS
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: warn

      # ================= Linux Export =================
      - name: Package Linux (AppImage & DEB)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: SpaceClean-${{ github.ref_name || 'v3.6.0' }}-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
